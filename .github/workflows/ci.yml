name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The security-critical suite: the non-GET transport tripwire, the
      # import-graph check, and the path-binding rejections all live here.
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Deliberately not go-version-file here. go.mod declares the oldest Go
      # this project supports, but govulncheck is a tool we run *on* the
      # code, not a constraint the code has to satisfy, and recent releases
      # need a newer toolchain than our floor. setup-go sets
      # GOTOOLCHAIN=local, so without this the install fails outright.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        # Unpinned on purpose: this is a scanner, and stale detection logic
        # is the one failure mode worth avoiding here. It never enters the
        # shipped binary, so it is outside the dependency budget.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # A dependency budget is only a budget if something counts it. This server
  # reaches the network with the standard library alone; a PR that adds a
  # module has to justify itself here first.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: dependency budget
        run: |
          budget=2
          count=$(go list -deps -f '{{if and .Module (not .Standard)}}{{.Module.Path}}{{end}}' ./... | sort -u | grep -v '^$' | wc -l | tr -d ' ')
          echo "non-stdlib modules in the build: $count (budget $budget)"
          go list -deps -f '{{if and .Module (not .Standard)}}{{.Module.Path}}{{end}}' ./... | sort -u | grep -v '^$' || true
          if [ "$count" -gt "$budget" ]; then
            echo "::error::dependency budget exceeded: $count > $budget"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
