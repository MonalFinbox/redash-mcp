name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The security-critical suite: the non-GET transport tripwire, the
      # import-graph check, and the path-binding rejections all live here.
      - name: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately not go-version-file here. go.mod declares the oldest Go
      # this project supports, but govulncheck is a tool we run *on* the
      # code, not a constraint the code has to satisfy, and recent releases
      # need a newer toolchain than our floor. setup-go sets
      # GOTOOLCHAIN=local, so without this the install fails outright.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        # Unpinned on purpose: this is a scanner, and stale detection logic
        # is the one failure mode worth avoiding here. It never enters the
        # shipped binary, so it is outside the dependency budget.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Every module in the build is named here, direct or transitive. The MCP
  # SDK brings its own dependencies, so a count would hide a swap; a list
  # means anything new fails this job and has to be argued for in review.
  # Network access still goes through internal/policy alone, which the
  # architecture tests enforce independently of this list.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: approved modules
        run: |
          approved=$(sort -u <<'EOF'
          github.com/MonalFinbox/redash-mcp
          github.com/google/jsonschema-go
          github.com/modelcontextprotocol/go-sdk
          github.com/segmentio/asm
          github.com/segmentio/encoding
          github.com/yosida95/uritemplate/v3
          golang.org/x/oauth2
          golang.org/x/sync
          golang.org/x/sys
          golang.org/x/time
          EOF
          )
          approved=$(echo "$approved" | tr -d ' ')
          actual=$(go list -deps -f '{{if and .Module (not .Standard)}}{{.Module.Path}}{{end}}' ./... | grep -v '^$' | sort -u)
          echo "modules in the build:"
          echo "$actual"
          unapproved=$(comm -23 <(echo "$actual") <(echo "$approved"))
          if [ -n "$unapproved" ]; then
            echo "::error::modules not on the approved list: $(echo $unapproved)"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
